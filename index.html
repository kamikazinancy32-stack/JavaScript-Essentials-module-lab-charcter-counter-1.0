<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap">
  <link rel="stylesheet" href="./style.css">
  <script src="./javascript.js" defer></script>
</head>

<body>
  <div class="container">
    <header class="header">
      <a href="./" class="logo" aria-label="Character Counter, home">
        <img src="./images/logo.svg" alt="" width="33" height="40">
        <span>Character Counter</span>
      </a>

      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch to light theme">
        <img src="./images/icon-sun.svg" alt="" id="theme-icon">
      </button>
    </header>

    <main>
      <h1>Analyze your text in real-time.</h1>

      <section class="text-area" aria-label="Text input">
        <label for="text-input" class="visually-hidden">Enter your text</label>
        <textarea
          id="text-input"
          placeholder="Start typing here… (or paste your text)"
          aria-describedby="limit-warning"
        ></textarea>

        <p class="limit-warning" id="limit-warning" role="alert" aria-atomic="true" hidden>
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <circle cx="7" cy="7" r="6.25" fill="none" stroke="currentColor" stroke-width="1.2" />
            <path d="M7 6.3v3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
            <circle cx="7" cy="4.4" r=".75" fill="currentColor" />
          </svg>
          <span id="limit-warning-text"></span>
        </p>

        <div class="options">
          <div class="option-group">
            <label class="checkbox">
              <input type="checkbox" id="exclude-spaces">
              Exclude Spaces
            </label>

            <div class="limit-option">
              <label class="checkbox">
                <input type="checkbox" id="limit-toggle" aria-controls="character-limit">
                Set Character Limit
              </label>

              <label for="character-limit" class="visually-hidden">Character limit</label>
              <input type="number" id="character-limit" class="limit-input" min="1" inputmode="numeric" disabled>
            </div>
          </div>

          <p class="reading-time" aria-live="polite">
            Approx. reading time: <span id="reading-time">0 minute</span>
          </p>
        </div>
      </section>

      <section aria-label="Text statistics">
        <ul class="stats">
          <li class="stat-card stat-card-characters">
            <p class="stat-number" id="character-count">00</p>
            <p class="stat-label">
              Total Characters<span class="stat-note" id="no-space-note" hidden> (no space)</span>
            </p>
          </li>

          <li class="stat-card stat-card-words">
            <p class="stat-number" id="word-count">00</p>
            <p class="stat-label">Word Count</p>
          </li>

          <li class="stat-card stat-card-sentences">
            <p class="stat-number" id="sentence-count">00</p>
            <p class="stat-label">Sentence Count</p>
          </li>
        </ul>
      </section>

      <section class="density" aria-labelledby="density-title">
        <h2 id="density-title">Letter Density</h2>

        <p class="density-empty" id="density-empty">
          No characters found. Start typing to see letter density.
        </p>

        <ul class="density-list" id="density-list"></ul>

        <button
          type="button"
          class="see-more"
          id="see-more"
          aria-expanded="false"
          aria-controls="density-list"
          hidden
        >
          <span id="see-more-text">See more</span>
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </section>
    </main>
  </div>
</body>
</html>
